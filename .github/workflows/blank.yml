name: Build Galmaetgil Senior Pedometer APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스 코드 다운로드 (Checkout)
      uses: actions/checkout@v4

    - name: Java 17 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Wrapper 권한 부여
      run: |
        chmod +x gradlew

    - name: 디버그 APK 빌드하기
      run: ./gradlew assembleDebug --no-daemon

    - name: APK 파일 업로드 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Galmaetgil-Senior-Pedometer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
