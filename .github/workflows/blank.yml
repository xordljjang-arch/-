name: Build Galmaetgil Senior Pedometer Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스 코드 다운로드 (Checkout)
      uses: actions/checkout@v4

    - name: Java 17 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Wrapper를 버전 8.6으로 강제 변경
      run: |
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        gradle wrapper --gradle-version 8.6 || true
        chmod +x gradlew || true

    - name: 정식 릴리즈 APK 빌드하기
      run: ./gradlew assembleRelease --no-daemon

    - name: APK 파일 업로드 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Galmaetgil-Senior-Pedometer-Release-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
